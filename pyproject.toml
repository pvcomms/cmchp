[project]
name = "cmchp"
version = "0.1.0"
description = "Cross-Model Context Handoff Protocol — semantic agent state compression for multi-LLM workflows"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "jinja2>=3.1.0",
    "typer>=0.12.0",
]

[project.scripts]
cmchp = "cmchp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmchp"]
